<body>
    <h1>JavaScript Web Output #1 </h1>

    <table>
        <tr>
            <td>
                <label for="textNum">Insert Positive Number:</label>
            </td>
            <td>
                <input type="number" id="textNum">

            <td colspan="2">

            </td>

    <button onclick="clearNumbers()">Clear Items</button>

        <option value="descending">Descending</option>
    </select>

    <script src="advanced.js"></script>
